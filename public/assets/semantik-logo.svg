<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <defs>
    <!-- Left Carbon Slate Gradient -->
    <linearGradient id="carbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242834" />
      <stop offset="50%" stop-color="#151821" />
      <stop offset="100%" stop-color="#0a0c11" />
    </linearGradient>

    <!-- Right Vivid Crimson Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b" />
      <stop offset="45%" stop-color="#c81e32" />
      <stop offset="100%" stop-color="#8a1120" />
    </linearGradient>

    <!-- Subtle Red Glow Filter -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Diamond Logo Mark Group -->
  <g transform="translate(6, 6)">
    <!-- Ambient back glow -->
    <rect x="18" y="18" width="28" height="28" rx="5" transform="rotate(45 32 32)" fill="#c81e32" opacity="0.25" filter="url(#crimsonGlow)" />

    <!-- Left Carbon Half -->
    <path d="M 32 8 L 8 32 L 32 56 Z" fill="url(#carbonGrad)" stroke="#3a4052" stroke-width="0.75" />

    <!-- Right Crimson Half -->
    <path d="M 32 8 L 56 32 L 32 56 Z" fill="url(#crimsonGrad)" stroke="#ff4d63" stroke-width="0.75" />

    <!-- Stylized S-Ribbon connecting the facets -->
    <path d="M 37 15 C 33 15 27 18 27 24 C 27 31 37 32 37 39 C 37 45 31 49 26 48" 
          stroke="#ffffff" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none" />
    
    <!-- Fine inner highlight on S-Curve -->
    <path d="M 36.5 17 C 33.5 17 29 19.5 29 24" 
          stroke="#ffffff" 
          stroke-width="1.5" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.8" />
  </g>

  <!-- Wordmark "SEMANTIK" -->
  <text x="76" y="44" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" letter-spacing="1.5" fill="#ffffff">
    SEMANTIK
  </text>

  <!-- Red Brand Period -->
  <circle cx="236" cy="41" r="3.5" fill="#c81e32" filter="url(#crimsonGlow)" />
</svg>
